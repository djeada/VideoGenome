<!doctype html>
<!--
  Beat visualizer: kinetic shapes that hit exactly on the beat of a music bed.

  The page cannot hear audio. It is synced by tempo: beat k lands at
  offset + k * 60 / bpm seconds, beat 0 of every bar (beats_per_bar) is the
  downbeat. A template locks the SAME bpm into this scene and its audio recipe
  (audio.pulse places its kick at exactly k * 60 / bpm from 0 s, so offset 0).
  Every envelope is evaluated half a frame late (t + 0.5/fps) so a hit peaks
  on the frame nearest the beat: the picture is never more than half a frame
  (16.7 ms at 30 fps) away from the kick.

  Styles
    rings  a core that swells on every kick, a mirrored ring of radial bars,
           ripples emitted on each beat (wider in the accent on downbeats) and
           a thin arc that fills over each bar
    bars   a mirrored equaliser: low bars follow the kick, middle bars the
           backbeat (2 and 4), top bars flick on the off-beat eighths
    orbit  a square that snaps a quarter turn on every beat, an orbit of dots
           thrown outward by each kick, and one marker per beat of the bar
  Text: kicker (small tracked caps), title, credit, and a beat counter. The
  copy enters on the first beats; with loop on it leaves during the last bar,
  so a whole number of bars loops seamlessly.

  Hits are pictured on small elements; full-frame brightness changes stay
  gentle, never strobing (at most one soft glow per beat).
  Timing: clock (requestAnimationFrame on VideoGenome's virtual clock). Copy
  is drawn with fillText, never parsed as HTML.
-->
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<script type="module">
import * as vg from "../../_lib/vg-scene/vg-scene.js";

const { spec, P, W, H, D, unit, portrait, seed } = vg.setup({
  title: "Night Transit", credit: "Weekly mix, Fridays at ten", kicker: "Now playing",
  style: "rings", bpm: 120, beats_per_bar: 4, offset: 0,
  palette: ["#07080D", "#F3F4F6", "#FF5A36", "#3D7BFF"], intensity: 1.0, offbeat: 0.4, loop: true, grain: 0.05,
});
const [BG, INK0, ACCENT, SECOND] = P.palette;
const ctx = vg.canvas2d();
const TAU = Math.PI * 2;
const FPS = spec.fps || 30;
const square = !portrait && Math.abs(W - H) < Math.min(W, H) * 0.2;
const landscape = W > H && !square;
const light = vg.luminance(BG) > 0.4;
const INK = vg.readable(BG, [INK0, light ? "#111111" : "#FFFFFF"]);
const MUTED = vg.readable(BG, [vg.mix(INK, BG, 0.3), vg.mix(INK, BG, 0.18), INK]);
const KICKER = vg.readable(BG, [ACCENT, vg.mix(ACCENT, INK, 0.4), INK]);
const SANS = vg.FONT;

// ---- beat clock -------------------------------------------------------------------------
const BEAT = 60 / P.bpm, BPB = P.beats_per_bar, BAR = BEAT * BPB;
const LEAD = 0.5 / FPS;
function clock(t) {
  const tt = t - P.offset + LEAD;
  const b = Math.floor(tt / BEAT);
  const since = tt - b * BEAT;                      // seconds since the latest beat
  const started = tt >= 0;
  const inBar = ((b % BPB) + BPB) % BPB;
  const kick = started ? Math.exp(-since / 0.12) : 0;
  const down = started && inBar === 0 ? kick : 0;
  const back = started && inBar % 2 === 1 ? Math.exp(-since / 0.09) : 0;
  const s8 = since - BEAT / 2;
  const off = started && s8 >= 0 ? Math.exp(-s8 / 0.05) * P.offbeat : 0;
  return { tt, b, since, inBar, kick, down, back, off, started, barPhase: started ? (inBar + since / BEAT) / BPB : 0 };
}

// ---- layout --------------------------------------------------------------------------------
const split = landscape && P.style !== "bars";
const textBox = split ? { x: W * 0.08, w: W * 0.36, align: "left" } : { x: W * 0.1, w: W * 0.8, align: "center" };
const clean = (s) => String(s || "").replace(/\s+/g, " ").trim();
const title = clean(P.title), credit = clean(P.credit), kicker = clean(P.kicker);
if (!title) throw new Error("beat-visualizer: the title is empty");
const titleMax = unit * (split ? 0.1 : portrait ? 0.105 : 0.085);
const T = vg.fit(ctx, title, { maxSize: titleMax, minSize: unit * 0.04, weight: 800, maxWidth: textBox.w,
                              maxLines: 2, leading: 1.02, label: "title" });
const C = credit ? vg.fit(ctx, credit, { maxSize: Math.max(unit * 0.034, T.size * 0.36), minSize: unit * 0.03, weight: 500,
                                       maxWidth: textBox.w, maxLines: 2, leading: 1.2, label: "credit" }) : null;
ctx.letterSpacing = "0.2em";
const K = kicker ? vg.fit(ctx, kicker.toUpperCase(), { maxSize: unit * 0.03, minSize: unit * 0.024, weight: 700,
                                                     maxWidth: textBox.w, maxLines: 1, label: "kicker" }) : null;
ctx.letterSpacing = "0px";
const gK = K ? K.size * 1.6 : 0, gC = C ? T.size * 0.45 : 0, dotsH = unit * 0.05;
const blockH = (K ? K.size + gK : 0) + T.height + (C ? gC + C.height : 0) + dotsH;
// Copy sits low (above the 9:16 UI zone) or beside the visual in 16:9; the
// visual is centred in the space that remains.
let textTop, vis;
if (split) {
  textTop = H / 2 - blockH / 2;
  vis = { cx: W * 0.68, cy: H * 0.5, r: unit * 0.36 };
} else {
  textTop = portrait ? H * 0.78 - blockH : H * 0.92 - blockH;
  const top = H * (portrait ? 0.12 : 0.07), bottom = textTop - unit * (P.style === "bars" ? 0.06 : 0.08);
  const want = unit * (portrait ? 0.4 : square ? 0.3 : 0.33);
  const r = Math.min(want, (bottom - top) / 2 / (P.style === "rings" ? 1.05 : 1));
  if (r < unit * 0.18) throw new Error("beat-visualizer: the copy is too tall for the frame; shorten it");
  vis = { cx: W / 2, cy: (top + bottom) / 2, r };
}

// ---- smooth seeded noise for the bar profiles ---------------------------------------------
const R = vg.rng(seed * 977 + 3);
const table = Float32Array.from({ length: 512 }, () => R());
function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return vg.lerp(table[i & 511], table[(i + 1) & 511], u);
}

// ---- background ---------------------------------------------------------------------------
const glowCanvas = document.createElement("canvas");
const gw = Math.max(48, Math.round(W / 10)), gh = Math.max(48, Math.round(H / 10));
glowCanvas.width = gw; glowCanvas.height = gh;
const gctx = glowCanvas.getContext("2d");
const bw = Math.ceil(W / 2), bh = Math.ceil(H / 2);
const back = document.createElement("canvas"); back.width = bw; back.height = bh;
const bctx = back.getContext("2d");
function background(t, c) {
  gctx.fillStyle = BG; gctx.fillRect(0, 0, gw, gh);
  gctx.globalCompositeOperation = light ? "multiply" : "screen";
  const theta = TAU * t / D;
  const spots = [
    [vis.cx / W + 0.12 * Math.sin(theta), vis.cy / H - 0.1 * Math.cos(theta), SECOND, 0.28 + 0.06 * c.down],
    [vis.cx / W - 0.15 * Math.cos(theta), vis.cy / H + 0.14 * Math.sin(theta), ACCENT, 0.12 + 0.12 * c.kick * P.intensity],
  ];
  for (const [x, y, color, a] of spots) {
    const r = Math.max(gw, gh) * 0.55, g = gctx.createRadialGradient(x * gw, y * gh, 0, x * gw, y * gh, r);
    const tone = light ? vg.mix("#FFFFFF", color, 0.4) : color;
    g.addColorStop(0, vg.rgba(tone, a)); g.addColorStop(1, vg.rgba(tone, 0));
    gctx.fillStyle = g; gctx.fillRect(0, 0, gw, gh);
  }
  gctx.globalCompositeOperation = "source-over";
  // Ground, glow, vignette and grain are composed at half resolution and scaled up
  // once with bilinear smoothing; the shapes and copy are drawn at full resolution.
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = "low";
  bctx.drawImage(glowCanvas, 0, 0, bw, bh);
  vg.vignette(bctx, light ? 0.1 : 0.32);
  vg.grain(bctx, t, P.grain * 1.4);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
  ctx.drawImage(back, 0, 0, W, H);
}

// ---- style: rings ------------------------------------------------------------------------
const SPOKES = 72;
function rings(t, c) {
  const { cx, cy, r } = vis, k = c.kick * P.intensity;
  const core = r * 0.34 * (1 + 0.14 * k + 0.06 * c.down * P.intensity);
  ctx.save();
  ctx.globalCompositeOperation = light ? "source-over" : "lighter";
  // Ripples: one per recent beat, accent and wider on downbeats.
  for (let j = 0; j < 6; j++) {
    const b = c.b - j;
    if (b < 0) break;
    const age = c.tt - b * BEAT;
    const life = age / (BEAT * 3.2);
    if (life > 1) continue;
    const isDown = ((b % BPB) + BPB) % BPB === 0;
    const rr = core + (r * 1.05 - core) * vg.ease.outCubic(life);
    ctx.strokeStyle = vg.rgba(isDown ? ACCENT : SECOND, (1 - life) * (isDown ? 0.75 : 0.4));
    ctx.lineWidth = unit * (isDown ? 0.006 : 0.0028) * (1 - life * 0.6);
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
  }
  // Radial bars, mirrored left/right.
  const inner = core * 1.18, rot = TAU * t / D * 0.25;
  ctx.lineCap = "round";
  for (let i = 0; i < SPOKES / 2; i++) {
    const f = i / (SPOKES / 2);
    const band = f < 0.35 ? c.kick : f < 0.7 ? Math.max(c.back, c.kick * 0.4) : Math.max(c.off, c.kick * 0.25);
    const h = r * (0.04 + 0.42 * noise1(i * 0.7 + t * 0.9) * (0.35 + 0.65 * band * P.intensity) * (1 - f * 0.45));
    const color = vg.mix(ACCENT, SECOND, f);
    ctx.strokeStyle = vg.rgba(color, 0.55 + 0.45 * band);
    ctx.lineWidth = unit * 0.0075;
    for (const side of [1, -1]) {
      const a = -Math.PI / 2 + side * (f + 0.5 / (SPOKES / 2)) * Math.PI + rot;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * (inner + h), cy + Math.sin(a) * (inner + h));
      ctx.stroke();
    }
  }
  ctx.restore();
  // Core disc.
  const g = ctx.createRadialGradient(cx - core * 0.3, cy - core * 0.35, core * 0.1, cx, cy, core);
  g.addColorStop(0, vg.mix(ACCENT, "#FFFFFF", 0.25 * k)); g.addColorStop(1, vg.mix(ACCENT, SECOND, 0.55));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, core, 0, TAU); ctx.fill();
  // Bar-progress arc around the core.
  ctx.strokeStyle = vg.rgba(INK, 0.85); ctx.lineWidth = unit * 0.004; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(cx, cy, core * 1.08, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0.002, c.barPhase)); ctx.stroke();
}

// ---- style: bars ---------------------------------------------------------------------------
function bars(t, c) {
  const n = landscape ? 48 : square ? 32 : 24;
  const span = W * (landscape ? 0.82 : 0.84), x0 = (W - span) / 2, step = span / n, bw = step * 0.56;
  const maxH = vis.r * 0.92;
  ctx.save();
  ctx.globalCompositeOperation = light ? "source-over" : "lighter";
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const band = f < 0.34 ? c.kick : f < 0.67 ? Math.max(c.back, c.kick * 0.35) : Math.max(c.off, c.kick * 0.3);
    const shape = 0.55 + 0.45 * Math.sin(Math.PI * (0.15 + 0.7 * f));          // taller in the middle
    const h = maxH * shape * (0.1 + 0.9 * vg.clamp((0.25 + 0.75 * noise1(i * 1.3 + t * 1.6)) * (0.3 + 0.7 * band * P.intensity)));
    const x = x0 + i * step + (step - bw) / 2;
    const color = vg.mix(ACCENT, SECOND, f);
    const g = ctx.createLinearGradient(0, vis.cy - h, 0, vis.cy + h);
    g.addColorStop(0, vg.rgba(color, 0.25)); g.addColorStop(0.5, vg.rgba(color, 0.95)); g.addColorStop(1, vg.rgba(color, 0.25));
    ctx.fillStyle = g;
    vg.roundRect(ctx, x, vis.cy - h, bw, h * 2, bw / 2); ctx.fill();
    // Peak caps that fall slowly after each hit.
    ctx.fillStyle = vg.rgba(INK, 0.35 + 0.5 * band);
    ctx.fillRect(x, vis.cy - h - bw * 0.9, bw, Math.max(2, bw * 0.28));
    ctx.fillRect(x, vis.cy + h + bw * 0.62, bw, Math.max(2, bw * 0.28));
  }
  ctx.restore();
  ctx.fillStyle = vg.rgba(INK, 0.5);
  ctx.fillRect(x0, vis.cy - 1, span * (0.02 + 0.98 * c.barPhase), 2);
}

// ---- style: orbit ---------------------------------------------------------------------------
const DOTS = 18;
function orbit(t, c) {
  const { cx, cy, r } = vis, k = c.kick * P.intensity;
  // Square: a quarter turn per beat, snapped with overshoot.
  const turn = (c.started ? c.b + vg.ease.outBack(vg.clamp(c.since / 0.32)) : 0) * Math.PI / 2;
  const s = r * 0.42 * (1 + 0.1 * k);
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(turn * 0.5);
  ctx.strokeStyle = ACCENT; ctx.lineWidth = unit * 0.012; ctx.lineJoin = "round";
  ctx.strokeRect(-s / 2, -s / 2, s, s);
  ctx.rotate(-turn);
  ctx.fillStyle = vg.rgba(SECOND, 0.9);
  const s2 = s * 0.42 * (1 + 0.25 * c.down * P.intensity);
  ctx.fillRect(-s2 / 2, -s2 / 2, s2, s2);
  ctx.restore();
  // Orbit of dots thrown outward on every kick.
  ctx.save();
  ctx.globalCompositeOperation = light ? "source-over" : "lighter";
  const orbitR = r * (0.62 + 0.12 * k + 0.05 * c.down);
  for (let i = 0; i < DOTS; i++) {
    const a = TAU * i / DOTS + TAU * t / D * 0.5;
    const big = i % 3 === 0;
    ctx.fillStyle = vg.rgba(big ? ACCENT : INK, big ? 0.9 : 0.5 + 0.4 * c.off);
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * orbitR, cy + Math.sin(a) * orbitR, unit * (big ? 0.012 : 0.006) * (1 + 0.5 * k), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  // One marker per beat of the bar on an outer ring; the current beat is lit.
  for (let i = 0; i < BPB; i++) {
    const a = -Math.PI / 2 + TAU * i / BPB;
    const lit = c.started && i === c.inBar;
    const m = unit * (lit ? 0.022 * (1 + 0.4 * c.kick) : 0.012);
    ctx.fillStyle = lit ? ACCENT : vg.rgba(INK, 0.35);
    ctx.save(); ctx.translate(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95); ctx.rotate(a + Math.PI / 4);
    ctx.fillRect(-m / 2, -m / 2, m, m); ctx.restore();
  }
}

// ---- copy -----------------------------------------------------------------------------------
const lastBarStart = Math.floor((D - P.offset - 1e-6) / BAR) * BAR + P.offset;
const exitAt = P.loop ? Math.max(D * 0.6, Math.min(lastBarStart, D - 0.8)) : Infinity;
function copy(t, c) {
  const enter = (at) => vg.tween(t, at, 0.5, vg.ease.outExpo);
  const leave = P.loop ? 1 - vg.tween(t, exitAt, Math.min(BAR * 0.6, D - exitAt) , vg.ease.inCubic) : 1;
  const first = Math.max(0, P.offset);
  let y = textTop;
  const ax = textBox.align === "left" ? textBox.x : W / 2;
  const line = (block, text, yTop, color, p, weight, spacing = "0px") => {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, yTop - block.size * 0.25, W, block.height + block.size * 0.45); ctx.clip();
    ctx.letterSpacing = spacing;
    vg.drawLines(ctx, block, ax, yTop + (1 - p) * block.size * 1.1, { color, align: textBox.align, alpha: Math.min(1, p * 1.4) * leave });
    ctx.restore();
  };
  if (K) { line(K, null, y, KICKER, enter(first), 700, "0.2em"); y += K.size + gK; }
  const pop = 1 + 0.015 * c.down;
  ctx.save();
  const tcx = textBox.align === "left" ? textBox.x : W / 2, tcy = y + T.height / 2;
  ctx.translate(tcx, tcy); ctx.scale(pop, pop); ctx.translate(-tcx, -tcy);
  line(T, null, y, INK, enter(first + BEAT), 800);
  ctx.restore();
  y += T.height;
  if (C) { y += gC; line(C, null, y, MUTED, enter(first + BEAT * 2), 500); y += C.height; }
  // Beat counter: one dot per beat of the bar.
  const p = enter(first + BEAT * 3) * leave;
  const gap = unit * 0.03, total = gap * (BPB - 1);
  const dx = textBox.align === "left" ? textBox.x + unit * 0.008 : W / 2 - total / 2;
  for (let i = 0; i < BPB; i++) {
    const lit = c.started && i === c.inBar;
    ctx.fillStyle = lit ? ACCENT : vg.rgba(INK, 0.3);
    ctx.globalAlpha = p;
    ctx.beginPath(); ctx.arc(dx + i * gap, y + dotsH * 0.6, unit * (lit ? 0.0075 * (1 + 0.3 * c.kick) : 0.005), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const draw = { rings, bars, orbit }[P.style] || rings;
vg.loop((t) => {
  const c = clock(t);
  background(t, c);
  draw(t, c);
  copy(t, c);
});
</script>
</body>
</html>
