<!doctype html>
<!--
  Code snippet: a self-contained code reveal. An editor window (title bar,
  file tab, line numbers) scales in under the title; the code types itself
  with a human rhythm (auto-indent, quicker runs inside words, pauses after
  punctuation and at line ends) and is syntax-highlighted by a small
  tokenizer for Python, JavaScript, Rust or Bash. The key lines are then
  highlighted while the rest dims, an optional terminal panel slides up and
  "runs" the file (the output is supplied text, never computed), and the title
  gives way to the takeaway. The code is displayed, never executed.

  Beats (D = duration):
    intro      0 .. 1.0 s                  title rises, window scales in
    typing     1.0 .. typeEnd              typeEnd = D - tail, tail = 1.8 (highlight)
                                           + 2.2 if there is output + 2.6 (takeaway)
    highlight  typeEnd + 0.25              key lines light up, others dim
    terminal   typeEnd + 2.05              panel slides up; command types for 0.5 s;
                                           output lines land 0.14 s apart after that
    takeaway   D - 2.6                     title lines leave, takeaway rises in
  (When D is short the tail shrinks in proportion; see `plan` below.)

  Timing: clock (requestAnimationFrame on VideoGenome's virtual clock). Copy is
  drawn with fillText and fitted with measured glyphs; the page throws when the
  code or copy cannot fit at a legible size.
-->
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<script type="module">
import * as vg from "../../_lib/vg-scene/vg-scene.js";

const { P, W, H, D, unit, portrait: tallFrame, seed } = vg.setup({
  title: "Count words in one line",
  filename: "count.py",
  language: "python",
  code: "from collections import Counter\n\ntext = \"the cat and the hat\"\ncounts = Counter(text.split())\n\nfor word, n in counts.most_common(2):\n    print(f\"{word}: {n}\")",
  highlight: [4],
  highlight_text: [],
  output: "the: 2\ncat: 1",
  command: "",
  takeaway: "Counter tallies anything iterable for you",
  palette: ["#0D1017", "#161B24", "#E6EAF2", "#7AA2FF", "#6B7385"],
  syntax: ["#C792EA", "#C3E88D", "#F78C6C", "#5C6773", "#82AAFF", "#FFCB6B", "#89DDFF"],
  pace: 0.9, grain: 0.03,

// Square and taller frames use the stacked (portrait) layout; wide frames the side-by-side one.
const portrait = tallFrame || W / H < 1.25;
const [BG, WIN, INK0, ACCENT, MUTED] = P.palette;

// ---- code and tokens ---------------------------------------------------------------
// Code and output arrive as multi-line strings (arrays are accepted too).
const asLines = (v) => (Array.isArray(v) ? v.map(String) : String(v ?? "").split("\n")).map((l) => l.replace(/\t/g, "    ").replace(/\s+$/, ""));
const lines = asLines(P.code);

const LANG = {
  python: {
    keywords: "False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case",

    comment: "#", strings: ["\"\"\"", "'''", "\"", "'"], prefixes: /^[rRbBfFuU]{1,2}(?=['"])/, decorator: true, capsType: true,
  },
  javascript: {
    keywords: "async await break case catch class const continue debugger default delete do else export extends finally for from function if import in instanceof let new of return static super switch this throw try typeof var void while yield null undefined true false",
    builtins: "console Math JSON Promise Array Object String Number Boolean Map Set Date document window fetch require module process setTimeout parseInt",
    comment: "//", block: true, strings: ["`", "\"", "'"], capsType: true,
  },
  rust: {
    keywords: "as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while",
    builtins: "i8 i16 i32 i64 i128 isize u8 u16 u32 u64 u128 usize f32 f64 bool char str String Vec Option Result Some None Ok Err Box HashMap",
    comment: "//", block: true, strings: ["\""], chars: true, macros: true, capsType: true,
  },
  bash: {
    keywords: "if then else elif fi for while until do done case esac in function return local export select time",
    builtins: "echo cd ls grep sed awk cat printf read set unset source exit test mkdir rm cp mv find xargs sort uniq wc head tail curl git tr cut tee touch chmod sudo",
    comment: "#", strings: ["\"", "'"], variables: true,

        else if (LANG.capsType && /^[A-Z][a-z0-9]/.test(word)) kind = "type";

        push(word, kind); i += word.length; continue;
      }
      if (P.language === "bash" && /^--?[A-Za-z]/.test(rest) && /\s/.test(line[i - 1] || " ")) {
        const f = rest.match(/^--?[\w-]+/); push(f[0], "num"); i += f[0].length; continue;

const tokens = tokenize(lines);

// Highlighted lines: numbers and/or exact text (whitespace-insensitive).

const dense = [], lineOf = [];

  const key = String(needle).replace(/\s+/g, "");
  if (!key) return;
  let at = denseCode.indexOf(key), found = 0;
  while (at >= 0) {
    for (let li = lineOf[at]; li <= lineOf[at + key.length - 1]; li++) hl.add(li);
    found++; at = denseCode.indexOf(key, at + 1);

// ---- beats ---------------------------------------------------------------------------
const output = asLines(P.output).filter((l, i, a) => l || a.slice(i).some(Boolean));

const command = String(P.command || "").trim() || {
  python: `python ${P.filename}`, javascript: `node ${P.filename}`, rust: "cargo run -q", bash: `bash ${P.filename}`,

  const room = Math.max(0, D - want.intro - Math.max(D * 0.4, 1.5));

const B = plan();

// Human typing rhythm: relative delays per character, then scaled to the window.

{

  lines.forEach((line, li) => {
    const indent = line.match(/^\s*/)[0].length;
    if (li > 0) clock += 2.2 + rnd() * 1.6;           // Enter, then a beat to think
    if (!line.trim()) { schedule.push({ line: li, col: line.length, at: clock }); return; }

    let burst = 0;
    for (let c = indent; c < line.length; c++) {
      const ch = line[c], prev = line[c - 1] || "";
      let d = 0.55 + rnd() * 0.7;
      if (/\w/.test(ch) && /\w/.test(prev)) { d *= 0.7; burst++; } else burst = 0;
      if (burst > 6) d *= 0.85;
      if (ch === " ") d *= 1.3;
      if (/[,:;({[]/.test(prev)) d *= 1.9;

// ---- layout ---------------------------------------------------------------------------
const m = Math.round(W * (portrait ? 0.075 : 0.06));
// Wide code gets more of the landscape frame; the title column narrows.
const widest = Math.max(...lines.map((l) => l.length));
const textW = portrait ? W - 2 * m : W * (widest > 44 ? 0.25 : 0.3);
const titleOpts = { maxSize: unit * (tallFrame ? 0.08 : portrait ? 0.062 : 0.072), minSize: unit * 0.04, weight: 800, leading: 1.06, maxWidth: textW, maxLines: 3 };

// 9:16 keeps copy out of the platform UI (top 12%, bottom 22%); square frames only need a margin.
const safeTop = tallFrame ? 0.12 : 0.07, safeBottom = tallFrame ? 0.78 : 0.93;
const headTop = portrait ? H * safeTop : 0;
const headH = Math.max(titleB.height, takeB ? takeB.height : 0) + unit * 0.05;

const cols = Math.max(...lines.map((l) => l.length), 12);
const outCols = hasTerm ? Math.max(...output.map((l) => l.length), command.length + 2) : 0;
const gutterCols = String(lines.length).length + 2;
const area = portrait
  ? { x: W * 0.055, y: headTop + headH + unit * 0.06, w: W * 0.89, h: H * safeBottom - (headTop + headH + unit * 0.06) }

const termLinesN = hasTerm ? output.length + 1 : 0;

  w: S.termW, h: S.termH,

    ctx.fillStyle = vg.rgba(ACCENT, 0.16 * hlP); ctx.fillRect(win.x, y, win.w * ease.outExpo(hlP), LH * fs);
    ctx.fillStyle = ACCENT; ctx.fillRect(win.x, y, Math.max(3, fs * 0.14), LH * fs * hlP);
  });
  vg.font(ctx, fs, 500, MONO);
  ctx.textBaseline = "middle";
  tokens.forEach((toks, li) => {
    const shown = typed.shown[li];
    const y = y0 + li * LH * fs + LH * fs / 2 - fs * 0.12;
    const dim = hl.size ? lerp(1, hl.has(li) ? 1 : 0.38, hlP) : 1;
    // Line number.
    ctx.globalAlpha = fade * (shown >= 0 ? (hl.has(li) && hlP > 0 ? 1 : 0.7) : 0.25) * (hl.has(li) ? 1 : dim);
    ctx.fillStyle = hl.has(li) && hlP > 0.5 ? ACCENT : muted;
    const num = String(li + 1);
    ctx.fillText(num, x0 + (gutterCols - 2 - num.length) * ADV * fs, y);
    if (shown < 0) return;
    ctx.globalAlpha = fade * dim;
    let col = 0;
    for (const tok of toks) {
      if (col >= shown) break;
      const part = tok.text.slice(0, shown - col);
      ctx.fillStyle = COLOR[tok.kind];
      if (tok.text.trim()) ctx.fillText(part, x0 + gutterW + col * ADV * fs, y);
      col += tok.text.length;
    }
  });
  ctx.globalAlpha = fade;
  // Cursor: solid while typing, blinking when idle; it leaves once the highlight begins.
  if (t < B.hlAt + 0.1) {
    const idle = t - typed.lastAt > 0.35;
    const on = !idle || Math.floor((t - typed.lastAt) / 0.5) % 2 === 0;
    if (on) {
      const cx = x0 + gutterW + typed.cursor.col * ADV * fs, cy = y0 + typed.cursor.line * LH * fs + LH * fs / 2 - fs * 0.12;
      ctx.fillStyle = ACCENT; ctx.fillRect(cx, cy - fs * 0.62, Math.max(2, fs * 0.1), fs * 1.24);
    }
  }
  ctx.restore();
  ctx.textBaseline = "alphabetic";
  ctx.restore();
}

function drawTerminal(t) {
  if (!hasTerm) return;
  const p = ease.outExpo(clamp((t - B.termAt) / 0.6));
  if (p <= 0) return;
  // Terminals stay dark, even beside a light editor.
  const termBg = vg.luminance(WIN) > 0.4 ? vg.mix(vg.luminance(INK0) < 0.2 ? INK0 : "#1B1F24", "#000000", 0.1) : vg.mix(WIN, "#000000", 0.35);
  const y = term.y + (1 - p) * unit * 0.08;
  ctx.save();
  ctx.globalAlpha = clamp(p * 1.5);
  const barH = BAR * 0.8 * fs;
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = unit * 0.05; ctx.shadowOffsetY = unit * 0.015;
  ctx.fillStyle = termBg; vg.roundRect(ctx, term.x, y, term.w, term.h, fs * 0.7); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = vg.mix(termBg, BG, 0.4);
  ctx.save(); vg.roundRect(ctx, term.x, y, term.w, term.h, fs * 0.7); ctx.clip(); ctx.fillRect(term.x, y, term.w, barH); ctx.restore();
  ctx.strokeStyle = vg.rgba(codeInk, 0.08); ctx.lineWidth = 1.5; vg.roundRect(ctx, term.x + 0.75, y + 0.75, term.w - 1.5, term.h - 1.5, fs * 0.7); ctx.stroke();
  vg.font(ctx, fs * 0.72, 600); ctx.fillStyle = muted; ctx.textBaseline = "middle";
  ctx.fillText("Terminal", term.x + padF * fs, y + barH / 2 + 1);
  const termInk = vg.readable(termBg, [codeInk, "#FFFFFF"]);
  vg.font(ctx, fs, 500, MONO);
  const x0 = term.x + padF * fs, y0 = y + barH + padF * fs;
  const cmdP = clamp((t - B.termAt - 0.3) / (0.5 * B.k + 0.1));
  const cmdChars = Math.round(command.length * cmdP);
  const ly = (i) => y0 + i * LH * fs + LH * fs / 2 - fs * 0.12;
  ctx.fillStyle = ACCENT; ctx.fillText("$", x0, ly(0));
  ctx.fillStyle = termInk; ctx.fillText(command.slice(0, cmdChars), x0 + 2 * ADV * fs, ly(0));
  const outStart = B.termAt + 0.3 + 0.5 * B.k + 0.25;
  if (t < outStart && Math.floor(t / 0.5) % 2 === 0 || cmdP < 1) {
    ctx.fillStyle = ACCENT; ctx.fillRect(x0 + (2 + cmdChars) * ADV * fs, ly(0) - fs * 0.62, Math.max(2, fs * 0.1), fs * 1.24);
  }
  output.forEach((line, i) => {
    const a = clamp((t - outStart - i * 0.14) / 0.12);
    if (a <= 0) return;
    ctx.globalAlpha = a; ctx.fillStyle = termInk;
    ctx.fillText(line, x0, ly(i + 1));
  });
  ctx.restore();
  ctx.textBaseline = "alphabetic";
}

vg.loop((t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  drawEditor(t);
  drawTerminal(t);
  drawHead(t);
  vg.vignette(ctx, vg.luminance(BG) > 0.5 ? 0.06 : 0.25);
  vg.grain(ctx, t, P.grain);
});
</script>
</body>
</html>
