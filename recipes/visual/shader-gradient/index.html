<!doctype html>
<!--
  Shader gradient: a soft "mesh gradient" in four palette colours, evaluated per
  pixel in a WebGL fragment shader. Colour weights come from slowly moving
  noise fields, so colours drift into each other like lit silk. Grain dithers
  the result. Contract: window.vgSetup(spec) then window.vgRender(frame, t).
-->
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="vg"></canvas>
<script>
const VERT = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 u_res;
uniform float u_time, u_speed, u_freq, u_softness, u_grain, u_angle, u_seed, u_brightness;
uniform vec3 u_c0, u_c1, u_c2, u_c3;

float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1 + u_seed * 0.0137); p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float v = 0.0, a = 0.55; for (int k = 0; k < 4; k++) { v += a * noise(p); p = p * 2.03 + 11.7; a *= 0.5; } return v; }
vec3 toLinear(vec3 c) { return pow(c, vec3(2.2)); }
vec3 toSrgb(vec3 c) { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }

void main() {
  vec2 uv = gl_FragCoord.xy / u_res.y;
  float a = radians(u_angle);
  uv = mat2(cos(a), -sin(a), sin(a), cos(a)) * uv;
  float t = u_time * u_speed;
  vec3 p = vec3(uv * u_freq, t);
  vec2 warp = vec2(fbm(p + vec3(0.0, 0.0, 0.0)), fbm(p + vec3(5.2, 1.3, 2.7)));
  vec3 q = vec3(uv * u_freq + 1.6 * warp, t * 0.7);
  // Four soft weights; exponent controls how crisp the colour boundaries are.
  vec4 w = vec4(fbm(q + 1.0), fbm(q + 7.0), fbm(q + 13.0), fbm(q + 19.0));
  // fBm clusters near 0.5; stretch it so each colour owns real regions.
  w = clamp((w - 0.28) * 2.6, 0.0, 1.0) + 0.015;
  w = pow(w, vec4(u_softness));
  w /= (w.x + w.y + w.z + w.w);
  vec3 col = w.x * toLinear(u_c0) + w.y * toLinear(u_c1) + w.z * toLinear(u_c2) + w.w * toLinear(u_c3);
  col *= u_brightness;
  float vig = smoothstep(1.25, 0.35, length((gl_FragCoord.xy / u_res - 0.5) * vec2(u_res.x / u_res.y, 1.0)));
  col *= mix(0.72, 1.0, vig);
  vec3 srgb = toSrgb(col);
  float g = hash(vec3(gl_FragCoord.xy, floor(u_time * 24.0))) - 0.5;
  gl_FragColor = vec4(srgb + g * u_grain, 1.0);
}`;

let gl, program, uniforms, spec;

function hexToVec(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}

window.vgSetup = async (s) => {
  spec = s;
  const canvas = document.getElementById("vg");
  canvas.width = s.width; canvas.height = s.height;
  gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
  if (!gl) throw new Error("WebGL unavailable");
  const compile = (type, src) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const u = (name) => gl.getUniformLocation(program, name);
  uniforms = { time: u("u_time") };
  const p = s.params;
  gl.uniform2f(u("u_res"), s.width, s.height);
  gl.uniform1f(u("u_speed"), p.speed);
  gl.uniform1f(u("u_freq"), p.frequency);
  gl.uniform1f(u("u_softness"), p.softness);
  gl.uniform1f(u("u_grain"), p.grain);
  gl.uniform1f(u("u_angle"), p.angle);
  gl.uniform1f(u("u_brightness"), p.brightness);
  gl.uniform1f(u("u_seed"), s.seed % 997);
  ["u_c0", "u_c1", "u_c2", "u_c3"].forEach((name, i) => gl.uniform3fv(u(name), hexToVec(p.palette[i])));
  gl.viewport(0, 0, s.width, s.height);
};

window.vgRender = (frame, t) => {
  gl.uniform1f(uniforms.time, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.finish();
};
</script>
</body>
</html>
