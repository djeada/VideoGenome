name: Validate and render blueprints

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter fontconfig
          ffmpeg -version | head -n 1
      - name: Install development requirements
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium-headless-shell
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build --wheel -o /tmp/dist .
          python -m pip install /tmp/dist/*.whl
      - name: Diagnose toolchain and fonts
        run: cd /tmp && videogenome doctor
      - name: Validate all blueprints
        run: python -m tools.validate
      - name: Run unit and media integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile documented example
        run: python -m videogenome compile examples/three-card-explainer/job.json -o /tmp/vg-plan.json
      - name: Render documented example
        run: python -m videogenome render examples/three-card-explainer/job.json -o /tmp/vg-demo.mp4 --receipt /tmp/vg-receipt.json
      - name: Render the vertical social example from outside the repository
        run: |
          mkdir -p /tmp/vg-vertical && cp examples/vertical-tips/job.json /tmp/vg-vertical/
          cd /tmp/vg-vertical && videogenome render job.json -o tips.mp4 --receipt receipt.json
      - name: Produce and render producible templates through the animatic pipeline
        run: |
          videogenome pipelines
          for example in narrated-slides code-typing-reel product-turntable; do
            directory="/tmp/vg-animatic-$example"
            mkdir -p "$directory" && cp examples/$example/job.json "$directory/"
            if [ "$example" = product-turntable ]; then
              python -m tools.create_product_model -o "$directory/bottle.glb"
            fi
            videogenome make "$directory/job.json" --pipeline animatic \
              -o "$directory/animatic.mp4" --receipt "$directory/receipt.json"
          done
      - name: Render procedural programmes and recipe previews
        run: |
          for example in three-card-explainer vertical-tips; do
            directory="/tmp/vg-procedural-$example"
            mkdir -p "$directory" && cp examples/$example/job.json "$directory/"
            videogenome make "$directory/job.json" --pipeline procedural \
              -o "$directory/procedural.mp4" --receipt "$directory/receipt.json"
          done
          mkdir -p /tmp/vg-recipes
          for recipe in $(videogenome recipes --json | python -c "import json,sys; print(' '.join(r['id'] for r in json.load(sys.stdin)))"); do
            case "$recipe" in audio.*) ext=wav ;; *) ext=mp4 ;; esac
            videogenome recipe "$recipe" --duration 4 --size 640x360 -o "/tmp/vg-recipes/$recipe.$ext"
          done
      - name: Verify resulting media
        run: |
          test -s /tmp/vg-demo.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/vg-demo.mp4
      - name: Render layered audio and captions for two briefs
        run: |
          for brief in editing learning; do
            directory="/tmp/vg-editorial-$brief"
            python -m tools.create_editorial_demo --brief "$brief" -o "$directory"
            python -m videogenome compile "$directory/job.json" -o "$directory/plan.json"
            python -m videogenome render "$directory/job.json" -o "$directory/demo.mp4" --receipt "$directory/receipt.json"
          done
      - name: Upload reproducible video and receipt
        uses: actions/upload-artifact@v4
        with:
          name: videogenome-demo
          path: |
            /tmp/vg-demo.mp4
            /tmp/vg-demo.*.jpg
            /tmp/vg-receipt.json
            /tmp/vg-vertical/
            /tmp/vg-animatic-*/animatic.*
            /tmp/vg-animatic-*/receipt.json
            /tmp/vg-animatic-*/generated/manifest.json
            /tmp/vg-procedural-*/procedural.*
            /tmp/vg-procedural-*/receipt.json
            /tmp/vg-recipes/
          if-no-files-found: error
      - name: Upload editorial previews and provenance
        uses: actions/upload-artifact@v4
        with:
          name: videogenome-editorial-examples
          path: |
            /tmp/vg-editorial-*/demo.*
            /tmp/vg-editorial-*/plan.json
            /tmp/vg-editorial-*/receipt.json
          if-no-files-found: error
