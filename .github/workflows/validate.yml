name: Validate and render blueprints

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Validate all blueprints
        run: python -m tools.validate
      - name: Run unit and media integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile documented example
        run: python -m videogenome compile examples/three-card-explainer/job.json -o /tmp/vg-plan.json
      - name: Render documented example
        run: python -m videogenome render examples/three-card-explainer/job.json -o /tmp/vg-demo.mp4 --receipt /tmp/vg-receipt.json
      - name: Verify resulting media
        run: |
          test -s /tmp/vg-demo.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/vg-demo.mp4
      - name: Upload reproducible video and receipt
        uses: actions/upload-artifact@v4
        with:
          name: videogenome-demo
          path: |
            /tmp/vg-demo.mp4
            /tmp/vg-receipt.json
          if-no-files-found: error
