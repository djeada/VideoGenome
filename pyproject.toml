[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "videogenome"
dynamic = ["version"]
description = "Expert-authored, renderer-independent video blueprints that smaller models fill and FFmpeg renders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Adam Djellouli" }]
keywords = ["video", "ffmpeg", "templates", "motion-graphics", "llm", "agents", "tts", "plugins", "comfyui", "blender", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Environment :: Console",
]
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
# Python recipes (visual.aurora, audio.ambient-pad, ...): numpy + scipy.
procedural = ["numpy>=1.24", "scipy>=1.10"]
# Browser recipes (WebGL / Canvas): then run `playwright install chromium-headless-shell`.
browser = ["playwright>=1.40"]

[project.scripts]
videogenome = "videogenome.__main__:main"

# Third-party packages extend VideoGenome the same way, e.g.:
# [project.entry-points."videogenome.providers"]
# my-tts = "my_package.tts:MyTTSProvider"

[tool.hatch.version]
path = "videogenome/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["videogenome"]

# Schemas and reviewed templates ship inside the package so an installed
# CLI resolves catalog ids without a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "videogenome/_data/schemas"
"templates" = "videogenome/_data/templates"
"pipelines" = "videogenome/_data/pipelines"
"recipes" = "videogenome/_data/recipes"
"genomes" = "videogenome/_data/genomes"

[tool.hatch.build.targets.sdist]
include = ["videogenome", "schemas", "templates", "pipelines", "recipes", "genomes", "examples", "tools", "tests", "docs",
           "README.md", "LICENSE", "CHANGELOG.md"]
